function fireEnemyShot(e,tx,ty,speed){let dx=tx-e.x,dy=ty-e.y,d=hypot(dx,dy)||1;projectiles.push({x:e.x,y:e.y,vx:dx/d*speed,vy:dy/d*speed,r:5,damage:e.damage*.75,t:4,c:'#d47cff'})}
function separateEnemies(){for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){let a=enemies[i],b=enemies[j];if(a.dead||b.dead)continue;let dx=b.x-a.x,dy=b.y-a.y,d=hypot(dx,dy)||1,min=(a.size+b.size)*.72;if(d<min){let push=(min-d)*.5,ux=dx/d,uy=dy/d;if(!a.boss){a.x-=ux*push;a.y-=uy*push}if(!b.boss){b.x+=ux*push;b.y+=uy*push}}}}
function updateDrops(dt){let p=G.player,t=gearTotals(),pickup=32+Math.min(35,t.speed*.2);for(const d of drops){d.t-=dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx*=.92;d.vy*=.92;let ds=hypot(p.x-d.x,p.y-d.y);if(ds<120&&d.type!=='health'){d.x+=(p.x-d.x)*dt*5;d.y+=(p.y-d.y)*dt*5}if(ds<pickup){if(d.type==='health'&&p.hp>=maxHp())continue;d.dead=true;if(d.type==='mat'){p.materials[d.mat]=(p.materials[d.mat]||0)+d.amount;toast(`+${d.amount} ${MAT_NAMES[d.mat]}`)}if(d.type==='health'){p.hp=Math.min(maxHp(),p.hp+Math.round(maxHp()*d.amount));toast('Health restored.')}if(d.type==='mana'){p.mana=Math.min(maxMana(),p.mana+d.amount)}if(d.type==='gear'){if(p.inventoryGear.length>=40){let lowest=p.inventoryGear.reduce((bi,q,i,a)=>gearScore(q)<gearScore(a[bi])?i:bi,0);if(gearScore(d.gear)>gearScore(p.inventoryGear[lowest])){let old=p.inventoryGear.splice(lowest,1,d.gear)[0];p.gold+=8+old.level*2;toast(`${d.gear.name} picked up · weakest spare salvaged.`)}else{p.gold+=8+d.gear.level*2;toast(`${d.gear.name} auto-salvaged · bag full.`)}}else{p.inventoryGear.push(d.gear);toast(`${RARITY[d.gear.rarity]} ${d.gear.name} acquired.`,2800)}}SFX.pickup();addParticle(d.x,d.y,d.type==='health'?'#ff6175':d.type==='mana'?'#65b7ff':d.type==='gear'?RC[d.gear.rarity]:'#ffd36a',7,1)}}drops=drops.filter(d=>!d.dead&&d.t>0)}
function updateProjectiles(dt){for(const q of projectiles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt;if(hypot(q.x-G.player.x,q.y-G.player.y)<q.r+14){q.dead=true;takeDamage(q.damage)}if(q.x<0||q.x>WORLD_W||q.y<50||q.y>WORLD_H)q.dead=true}projectiles=projectiles.filter(q=>!q.dead&&q.t>0)}
function update(dt){if(G.paused||G.state!=='play')return;G.worldTime+=dt;G.stats.playSeconds+=dt;G.autosave+=dt;if(G.autosave>20){G.autosave=0;saveGame()}let p=G.player;p.attackCd=Math.max(0,p.attackCd-dt);p.dashCd=Math.max(0,p.dashCd-dt);p.skillCd=Math.max(0,p.skillCd-dt);p.invuln=Math.max(0,p.invuln-dt);p.hitFlash=Math.max(0,p.hitFlash-dt);p.mana=Math.min(maxMana(),p.mana+dt*(2.2+G.player.intelligence*.08));if(attackFx){attackFx.t-=dt;if(attackFx.t<=0)attackFx=null}skillFx=Math.max(0,skillFx-dt);let dx=touchMove.x+((keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)),dy=touchMove.y+((keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0));if(dx||dy){let d=hypot(dx,dy);if(d>1){dx/=d;dy/=d}p.vx=lerp(p.vx,dx*moveSpeed(),Math.min(1,dt*13));p.vy=lerp(p.vy,dy*moveSpeed(),Math.min(1,dt*13));if(!mouse.active||matchMedia('(pointer:coarse)').matches){p.facingX=dx;p.facingY=dy;p.aimX=dx;p.aimY=dy}}else{p.vx=lerp(p.vx,0,Math.min(1,dt*11));p.vy=lerp(p.vy,0,Math.min(1,dt*11))}p.x=clamp(p.x+p.vx*dt,28,WORLD_W-28);p.y=clamp(p.y+p.vy*dt,70,WORLD_H-28);spawnTimer-=dt;if(spawnTimer<=0){spawnTimer=clamp(1.18-G.area*.08-G.cycle*.04,.55,1.2);maybeSpawn()}for(const h of herbs)if(!h.ready){h.t-=dt;if(h.t<=0)h.ready=true}for(const e of [...enemies])updateEnemy(e,dt);enemies=enemies.filter(e=>!e.dead);separateEnemies();updateProjectiles(dt);updateDrops(dt);for(const f of floaters){f.y-=34*dt;f.t-=dt}floaters=floaters.filter(f=>f.t>0);for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=75*dt;q.life-=dt}particles=particles.filter(q=>q.life>0);updateCamera(dt)}

function drawWorld(){groundTile(G.area);if(G.area===0)drawTown();else{drawDecor();drawGate(78,405,false);drawGate(1360,405,G.storyStage<G.area)}drawHerbs();drawDrops();for(const e of enemies)drawEnemy(e);drawProjectiles();drawPlayer();drawFx();if(G.area===4){ctx.globalAlpha=.06;rect(0,0,W,H,'#ff5c43');ctx.globalAlpha=1}}
function renderHud(){let p=G.player,mh=maxHp(),mm=maxMana();el.hpFill.style.width=clamp(p.hp/mh*100,0,100)+'%';el.hpText.textContent=`HP ${Math.ceil(p.hp)} / ${mh}`;el.mpFill.style.width=clamp(p.mana/mm*100,0,100)+'%';el.mpText.textContent=`MANA ${Math.floor(p.mana)} / ${mm} · R ${p.skillCd>0?p.skillCd.toFixed(1):'READY'}`;el.xpFill.style.width=clamp(p.xp/p.xpNext*100,0,100)+'%';el.xpText.textContent=`LEVEL ${p.level} · XP ${p.xp} / ${p.xpNext}`;el.hudInfo.innerHTML=`Gold <b>${fmt(p.gold)}</b> · Potions <b>${p.potions}</b> · Points <b>${p.points}</b><br>${weaponData().name} · Power <b>${Math.round(playerPower())}</b> · DEF <b>${defense()}</b> · Dash ${p.dashCd>0?p.dashCd.toFixed(1):'READY'}`;el.areaTitle.innerHTML=`${AREA[G.area].name}<small>${AREA[G.area].sub} · CYCLE ${G.cycle}</small>`;el.quest.innerHTML=questText();el.mapStrip.innerHTML=AREA.map((a,i)=>`<div class="mapNode ${i===G.area?'here':''} ${i>0&&G.bossDefeated[i]?'done':''}" title="${a.name}"></div>`).join('');let b=enemies.find(e=>e.boss&&!e.dead);if(b){el.bossHud.classList.add('show');el.bossName.textContent=b.name;el.bossFill.style.width=clamp(b.hp/b.maxHp*100,0,100)+'%'}else el.bossHud.classList.remove('show');el.prompt.textContent=promptText()}
function promptText(){let p=G.player;if(G.area===0){let st=nearTownStation();if(st)return `E — ${st.id==='blacksmith'?'Craft at Blacksmith':st.id==='alchemist'?'Craft at Alchemist':st.id==='wardrobe'?'Open Wardrobe':'Talk to Archivist'}`;if(hypot(p.x-1330,p.y-405)<85)return 'E — Enter Slime Fields'}else{for(const h of herbs)if(h.ready&&hypot(p.x-h.x,p.y-h.y)<55)return 'E — Harvest Red Herb';if(hypot(p.x-78,p.y-405)<82)return `E — Return to ${AREA[G.area-1].name}`;if(hypot(p.x-1360,p.y-405)<82)return G.storyStage>=G.area?(G.area<4?`E — Enter ${AREA[G.area+1].name}`:'The Ash Crown is here'):`Locked — Defeat ${BOSSES[G.area].name}`}return ''}
function render(){drawWorld();renderHud()}
let last=performance.now(),acc=0;function frame(t){let dt=Math.min(.05,(t-last)/1000);last=t;let steps=Math.max(1,Math.ceil(dt/.0167)),sd=dt/steps;for(let i=0;i<steps;i++)update(sd);render();pressed.clear();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function visibilityPause(){if(document.hidden&&G.state==='play'&&!G.paused){pauseGame();saveGame(true)}}document.addEventListener('visibilitychange',visibilityPause);window.addEventListener('beforeunload',()=>saveGame(true));
function toggleDev(){if(!devPanel){devPanel=document.createElement('div');devPanel.style.cssText='position:absolute;left:12px;top:150px;z-index:80;background:#08070bea;border:1px solid #9b7048;padding:10px;font:10px monospace;max-width:260px';devPanel.innerHTML='<b>DEV MENU</b><br><button data-dev="level">+ LEVEL</button> <button data-dev="mats">+ MATS</button><br><button data-dev="gear">DROP LEGENDARY</button> <button data-dev="boss">SPAWN BOSS</button><br><button data-dev="clear">CLEAR ZONE</button> <button data-dev="cycle">+ CYCLE</button><br><div id="devTests"></div>';$('#frame').appendChild(devPanel);devPanel.addEventListener('click',e=>{let a=e.target.dataset.dev;if(!a)return;if(a==='level')gainXp(G.player.xpNext);if(a==='mats')Object.keys(G.player.materials).forEach(k=>G.player.materials[k]+=20);if(a==='gear'){let q=generateGear(G.player.level,4);G.player.inventoryGear.push(q);toast(q.name+' added.')}if(a==='boss'&&G.area>0&&!bossRef)spawnBoss(G.area);if(a==='clear'&&G.area>0){G.zoneKills[G.area]=BOSSES[G.area].goal;maybeSpawn()}if(a==='cycle'){G.cycle++;toast('Dev Cycle '+G.cycle)}$('#devTests').textContent=`Tests ${SELF_TESTS.ok}/${SELF_TESTS.total}`})}devOpen=!devOpen;devPanel.style.display=devOpen?'block':'none';if(devOpen)$('#devTests').textContent=`Tests ${SELF_TESTS.ok}/${SELF_TESTS.total}`}
function runSelfTests(){let tests=[];const ok=(name,v)=>tests.push({name,ok:!!v});ok('clamp upper',clamp(9,0,5)===5);ok('stat costs rise',statCost(1)===1&&statCost(6)===2&&statCost(11)===3);let ds=diffScale();ok('difficulty positive',ds.hp>=1&&ds.damage>=1&&ds.speed>=1);let g=generateGear(10,4,'weapon');ok('legendary gear valid',g.rarity===4&&g.slot==='weapon'&&g.power>0&&!!g.weaponType);let s={head:{hp:10,defense:2}},tot=gearTotals(s);ok('gear totals',tot.hp===10&&tot.defense===2);ok('health pickup rule',maxHp()>0);ok('world dimensions',WORLD_W>W&&WORLD_H>H);ok('rarity palette',RARITY.length===RC.length);let result={ok:tests.filter(t=>t.ok).length,total:tests.length,tests};console.table(tests);return result}
let SELF_TESTS=runSelfTests();window.__ASHBOUND_TESTS__=SELF_TESTS;window.__ashboundGame=()=>G;
function smokeStart(){G=newGameState();G.tutorialSeen=true;G.introSeen=true;G.state='play';G.paused=false;G.area=1;G.player.x=520;G.player.y=405;rebuildArea();for(let i=0;i<6;i++)spawnEnemy('slime',650+i*55,320+(i%2)*90,i%3);setTimeout(()=>{document.body.dataset.smoke=window.__ASHBOUND_ERRORS__.length?'error':'ok';window.__ASHBOUND_SMOKE__={errors:[...window.__ASHBOUND_ERRORS__],enemies:enemies.length,tests:SELF_TESTS,area:G.area}},900)}
function init(){refreshTitle();rebuildArea();applyTouchVisibility();let q=new URLSearchParams(location.search);if(q.has('smoke')){hideAllScreens();smokeStart()}if('serviceWorker'in navigator&&!location.protocol.startsWith('file'))navigator.serviceWorker.register('./sw.js').catch(()=>{});if(!SELF_TESTS.tests.every(t=>t.ok))document.body.dataset.selftest='fail'}
init();
</script>
