name: Materialize ASHDBOUND 0.30 source

on:
  push:
    paths:
      - '.github/workflows/materialize-030-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct canonical 0.30 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src
          cat ab030.01.b64 ab030.02.b64 ab030.03.b64 ab030.04.b64 ab030.05.b64 | base64 -d | gunzip > src/ashbound-0.30.0.html
          test "$(sha256sum src/ashbound-0.30.0.html | awk '{print $1}')" = "1baeb77052076291ed12588db4a2e9e5706c36d791b37f99a724f376accbf877"
          grep -q "ASHBOUND 0.30.0 EMBERLOOP ALPHA" src/ashbound-0.30.0.html
      - name: Commit readable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ashbound-0.30.0.html
          if git diff --cached --quiet; then
            echo "Canonical source already materialized."
          else
            git commit -m "Materialize canonical ASHBOUND 0.30 source"
            git push
          fi
